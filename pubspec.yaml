name: financer
description: Personal finance planner with quick expenses, budgets, loans, debts and PDF reports.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.33.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
